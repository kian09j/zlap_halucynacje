<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #787774;
    --faint: #9b9a97;
    --line: #e9e9e7;
    --hover: #f7f7f5;
    --gray: #f1f1ef;
    --blue: #2383e2;
    --blue-hover: #0b6ec5;
    --blue-bg: #e7f3f8;
    --blue-text: #337ea9;
    --green: #448361;
    --green-bg: #dbeddb;
    --red: #d44c47;
    --red-bg: #fdebec;
    --yellow-bg: #fbf3db;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif, "Segoe UI Emoji", "Apple Color Emoji";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { width: 100%; max-width: 680px; }
  a { color: var(--blue-text); }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .logo .ai {
    font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 85%;
    color: #eb5757; background: rgba(135, 131, 120, 0.15); border-radius: 4px; padding: 1px 5px;
  }
  .lang { display: flex; gap: 2px; background: var(--gray); border-radius: 6px; padding: 2px; }
  .lang button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
    background: transparent; border: 0; border-radius: 4px; padding: 2px 10px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(15, 15, 15, 0.12); }
  .lang button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .stats { display: flex; gap: 6px; }
  .pill {
    font-size: 13px; font-weight: 500; color: var(--muted); background: var(--gray);
    border-radius: 4px; padding: 2px 8px; display: flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .pill.bump { animation: bump 0.4s ease; }
  @keyframes bump { 50% { transform: scale(1.12); } }

  /* Progress: one segment per text */
  .trail { display: flex; gap: 4px; margin: 0 0 26px; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .step.now { background: var(--blue); }
  .step.ok { background: #6fbf8a; }
  .step.part { background: #e9c46a; }
  .step.no { background: #e8a5a1; }

  .screen-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Mascot */
  .mascot { display: block; overflow: visible; transform-origin: 50% 100%; }
  .mascot .eyes-open { transform-origin: 60px 56px; animation: blink 5s ease-in-out infinite; }
  .mascot .eyes-happy, .mascot .m-big, .mascot .m-o { display: none; }
  .mascot[data-mood="happy"] .eyes-open, .mascot[data-mood="happy"] .m-smile { display: none; }
  .mascot[data-mood="happy"] .eyes-happy, .mascot[data-mood="happy"] .m-big { display: inline; }
  .mascot[data-mood="happy"] { animation: hop 0.5s ease; }
  .mascot[data-mood="oops"] .m-smile { display: none; }
  .mascot[data-mood="oops"] .m-o { display: inline; }
  .mascot[data-mood="oops"] { animation: shake 0.4s ease; }
  .mascot .pupil { transition: transform 0.3s; }
  .mascot[data-mood="think"] .pupil { transform: translate(2px, -2px); }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
  @keyframes hop { 50% { transform: translateY(-8px); } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .guide { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .guide .mascot { width: 44px; height: 44px; flex: 0 0 44px; }
  .bubble { flex: 1; background: var(--gray); border-radius: 6px; padding: 10px 14px; }
  .bubble.ok { background: var(--green-bg); }
  .bubble.part { background: var(--yellow-bg); }
  .bubble.no { background: var(--red-bg); }
  .bubble.pop { animation: fadeIn 0.25s ease; }

  .round-tag {
    display: inline-block; font-size: 12px; font-weight: 500; color: var(--blue-text); background: var(--blue-bg);
    border-radius: 4px; padding: 1px 7px; margin-bottom: 8px;
  }
  .task { font-size: 20px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; margin: 2px 0 18px; }

  .box-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }

  /* The source: what is true */
  .src { background: var(--yellow-bg); border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }
  .src ul { margin: 0; padding: 0 0 0 18px; }
  .src li { margin: 2px 0; padding: 1px 4px; border-radius: 3px; transition: background 0.3s; }
  .src li.hit { background: #f8d66d; }

  /* The AI's text: sentences the player can flag */
  .ai { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04); }
  .ai .q { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .ai .q b { color: var(--text); font-weight: 600; }
  .ai .body { margin: 0; font-size: 17px; line-height: 1.7; }
  .sent {
    cursor: pointer; border-radius: 3px; padding: 1px 2px; transition: background 0.12s;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .sent:hover { background: var(--hover); box-shadow: inset 0 -1px 0 #d3d1cb; }
  .sent:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .sent[aria-pressed="true"] { background: var(--red-bg); color: #8a2c28; box-shadow: inset 0 -2px 0 #f0b8b5; }
  .sent[aria-pressed="true"]::before { content: "🚩 "; }
  .checked .sent { cursor: default; }
  .checked .sent:hover { background: transparent; box-shadow: none; }
  .checked .sent.caught { background: var(--green-bg); color: var(--text); box-shadow: inset 0 -2px 0 #9fd0ac; }
  .checked .sent.caught::before { content: "✓ "; color: var(--green); font-weight: 700; }
  .checked .sent.missed { background: transparent; color: var(--text); text-decoration: underline wavy var(--red); text-underline-offset: 4px; }
  .checked .sent.missed::before { content: "⚠ "; color: var(--red); }
  .checked .sent.wrongflag { background: var(--gray); color: var(--muted); box-shadow: none; }
  .checked .sent.wrongflag::before { content: "↩ "; }

  .check-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .counter { font-size: 14px; color: var(--muted); }
  .counter.nudge { color: var(--red); animation: shake 0.3s ease; }

  /* Notes after checking */
  .notes { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  .notes li { border-radius: 6px; padding: 10px 12px; border: 1px solid var(--line); animation: fadeIn 0.25s both; }
  .notes .tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 4px; padding: 1px 7px; margin-bottom: 4px; }
  .notes .caught .tag { background: var(--green-bg); color: var(--green); }
  .notes .missed .tag { background: var(--red-bg); color: var(--red); }
  .notes .wrongflag .tag { background: var(--gray); color: var(--muted); }
  .notes q { display: block; font-style: italic; color: var(--muted); margin-bottom: 2px; }
  .notes q::before, .notes q::after { content: ""; }

  /* Lesson callout */
  .lesson { margin-top: 18px; padding: 14px 16px; border-radius: 6px; background: var(--gray); animation: fadeIn 0.3s 0.1s both; }
  .lesson h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .lesson p { margin: 0; }

  /* Buttons */
  .btn {
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; border: 0; border-radius: 6px;
    padding: 8px 16px; background: var(--blue); color: #fff; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px; transition: background 0.12s, opacity 0.12s;
    box-shadow: inset 0 0 0 1px rgba(15, 15, 15, 0.1), 0 1px 2px rgba(15, 15, 15, 0.1);
  }
  .btn:hover:not(:disabled) { background: var(--blue-hover); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .actions { margin-top: 20px; display: flex; justify-content: flex-end; }

  .footnote { margin: 32px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
  .hidden { display: none !important; }

  /* Start and end pages */
  .hero { display: flex; flex-direction: column; align-items: flex-start; }
  .hero .mascot { width: 76px; height: 76px; margin: 12px 0 10px; }
  .hero .bubble { flex: none; width: 100%; margin: 0 0 8px; }
  h1 { font-size: 38px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 14px; }
  h2 { font-size: 20px; font-weight: 600; margin: 28px 0 10px; }

  .what { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin: 6px 0 4px; }
  .what strong { font-weight: 600; }
  .what p { margin: 2px 0 0; color: var(--muted); }
  .how { width: 100%; margin: 10px 0 18px; }
  .how h2 { margin-top: 12px; }
  .how ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
  .how li { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
  .how .num {
    flex: 0 0 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
    font-size: 14px; font-weight: 600;
  }
  .how strong { display: block; font-weight: 600; }
  .how p { margin: 2px 0 0; color: var(--muted); }
  .expect { width: 100%; background: var(--blue-bg); border-radius: 6px; padding: 12px 14px; margin: 0 0 22px; }
  .expect strong { font-weight: 600; }
  .expect p { margin: 2px 0 0; }
  .series { margin: 26px 0 0; font-size: 14px; color: var(--muted); }
  .series a { margin-right: 10px; white-space: nowrap; }
  .series.home { margin-top: 8px; }

  .score-blob b { font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
  .score-blob span { color: var(--muted); }
  .score-msg { color: var(--muted); margin: 4px 0 4px; }
  .rules { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
  .rules li {
    display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 6px;
    background: var(--note); animation: fadeIn 0.3s both; animation-delay: var(--delay);
  }
  .rules .num {
    flex: 0 0 24px; height: 24px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(15, 15, 15, 0.1);
  }
  .rules strong { font-weight: 600; }
  .callout { display: flex; gap: 10px; align-items: flex-start; border-radius: 6px; padding: 12px 14px; background: var(--blue-bg); }
  .callout .ico { font-size: 18px; line-height: 1.3; }
  .callout strong { display: block; font-weight: 600; }
  .end-actions { margin-top: 22px; }

  @media (max-width: 480px) {
    body { padding-top: 16px; }
    h1 { font-size: 30px; }
    .task { font-size: 18px; }
    .ai .body { font-size: 16px; }
    .check-row { flex-wrap: wrap; }
    .actions .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo" id="logo">Złap <span class="ai">halucynację</span></div>
    <div class="lang" id="lang" role="group" aria-label="Język / Language">
      <button type="button" data-lang="pl" aria-pressed="true">PL</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="stats hidden" id="stats">
      <div class="pill" id="progressText">1/4</div>
      <div class="pill" id="scoreText"></div>
    </div>
  </header>
  <div class="trail hidden" id="trail"></div>

  <main id="screen"></main>
  <p class="footnote hidden" id="footnote"></p>
</div>

<script>
/*
  Each text: a source (what is true) and the AI's text as a list of sentences.
  A sentence with h is made up: h.src is the index of the source line to compare with,
  h.note says what the source actually says.
*/

const ROUNDS_PL = [
  {
    task: "AI streściło notatkę ze spotkania z klientem. Znajdź 2 zdania, które nie zgadzają się z notatką.",
    srcTitle: "Notatka ze spotkania",
    src: [
      "Spotkanie z firmą Nordtex, 14 marca.",
      "Obecni: Marta (my), pan Marek Zieliński (Nordtex).",
      "Nordtex chce zamówić 200 krzeseł biurowych, dostawa do końca kwietnia.",
      "Cena: 450 zł za sztukę. Rabat 5% przy płatności z góry, do decyzji Nordtexu.",
      "Następny krok: Marta wysyła ofertę do piątku."
    ],
    aiTitle: "Podsumowanie od AI",
    sents: [
      { t: "Spotkanie z firmą Nordtex odbyło się 14 marca." },
      { t: "Ze strony Nordtexu był obecny pan Marek Zieliński." },
      { t: "Nordtex chce zamówić 250 krzeseł biurowych z dostawą do końca kwietnia.", h: { src: 2, note: "W notatce: 200 krzeseł, nie 250." } },
      { t: "Cena to 450 zł za sztukę, z możliwym rabatem 5% przy płatności z góry." },
      { t: "Następny krok: Marta wysyła ofertę do poniedziałku.", h: { src: 4, note: "W notatce: oferta do piątku." } }
    ],
    lesson: "AI potrafi pomylić liczby i daty nawet wtedy, gdy ma je przed sobą. Liczby, daty i nazwy zawsze porównuj ze źródłem, zanim wyślesz tekst dalej."
  },
  {
    task: "AI napisało artykuł do firmowego newslettera na podstawie wyników ankiety. Znajdź 2 zmyślone zdania.",
    srcTitle: "Wyniki ankiety wewnętrznej, luty 2026",
    src: [
      "W ankiecie wzięło udział 120 pracowników.",
      "64% chce pracować zdalnie 2 lub 3 dni w tygodniu.",
      "Najczęstszy problem: słaba jakość połączeń wideo w salach.",
      "Zarząd omówi wyniki na spotkaniu w marcu."
    ],
    aiTitle: "Artykuł od AI",
    sents: [
      { t: "W lutowej ankiecie wzięło udział 120 pracowników." },
      { t: "64% z nich chce pracować zdalnie 2 lub 3 dni w tygodniu." },
      { t: "To zgodne z badaniem Instytutu Badań nad Pracą Hybrydową z 2025 roku, według którego praca hybrydowa zwiększa produktywność o 27%.", h: { src: -1, note: "W źródle nie ma żadnego badania. AI potrafi dopisać „badania” i liczby, które brzmią wiarygodnie, ale nie istnieją." } },
      { t: "Najczęściej zgłaszany problem to słaba jakość połączeń wideo w salach." },
      { t: "Prezes firmy skomentował: „Wyniki pokazują, że elastyczność to nasza przyszłość”.", h: { src: -1, note: "W źródle nie ma żadnego cytatu. Prezes nic takiego nie powiedział." } },
      { t: "Zarząd omówi wyniki na spotkaniu w marcu." }
    ],
    lesson: "AI lubi dodawać badania i cytaty, bo tak wyglądają dobre artykuły. Jeśli w tekście od AI jest źródło albo cytat, sprawdź, czy naprawdę istnieje. Jeśli nie da się tego sprawdzić, usuń je."
  },
  {
    task: "Pracownik zapytał AI o zasady rozliczania podróży. Znajdź 2 zdania, które przekręcają regulamin.",
    srcTitle: "Regulamin podróży służbowych (fragment)",
    src: [
      "Pociąg: można kupić bilet w 1. klasie, jeśli podróż trwa ponad 3 godziny.",
      "Hotel: do 400 zł za noc. Wyższą kwotę musi zatwierdzić przełożony.",
      "Taksówki: tylko gdy nie ma komunikacji publicznej albo po 22:00.",
      "Rozliczenie: do 14 dni od powrotu, z rachunkami."
    ],
    aiTitle: "Odpowiedź AI",
    question: "Co mogę rozliczyć z podróży do Gdańska?",
    sents: [
      { t: "Bilet w 1. klasie możesz kupić, jeśli podróż trwa ponad 3 godziny." },
      { t: "Za hotel możesz wydać do 400 zł za noc, a wyższą kwotę zatwierdza przełożony." },
      { t: "Taksówkę możesz rozliczyć zawsze, jeśli masz rachunek.", h: { src: 2, note: "W regulaminie: tylko gdy nie ma komunikacji publicznej albo po 22:00. AI zgubiło warunek." } },
      { t: "Rozliczenie składasz do 14 dni od powrotu." },
      { t: "Rachunki nie są potrzebne, wystarczy wpisać kwoty w systemie.", h: { src: 3, note: "W regulaminie: rozliczenie z rachunkami. AI odwróciło sens." } },
      { t: "Miłej podróży do Gdańska!" }
    ],
    lesson: "Najtrudniej wyłapać drobne zmiany sensu: zgubiony warunek, „zawsze” zamiast „tylko gdy”, „nie trzeba” zamiast „trzeba”. Przy zasadach i przepisach czytaj odpowiedź AI zdanie po zdaniu razem ze źródłem. A uprzejme „miłej podróży” to nie halucynacja: liczą się fakty."
  },
  {
    task: "Klient zapytał czat na stronie sklepu o słuchawki. Znajdź 2 zdania, których nie ma w opisie produktu.",
    srcTitle: "Opis produktu: słuchawki Nordo Air",
    src: [
      "Bateria: do 30 godzin słuchania.",
      "Ładowanie: USB-C, pełne ładowanie w 2 godziny.",
      "Gwarancja: 2 lata.",
      "Kolory: czarny i biały."
    ],
    aiTitle: "Odpowiedź czatu AI",
    question: "Czy słuchawki są wodoodporne i czy mogę je zwrócić po 30 dniach?",
    sents: [
      { t: "Dziękujemy za pytanie o słuchawki Nordo Air!" },
      { t: "Tak, słuchawki są wodoodporne w klasie IPX4, więc możesz w nich biegać w deszczu.", h: { src: -1, note: "W opisie produktu nie ma ani słowa o wodoodporności. AI wymyśliło konkretną klasę, żeby odpowiedź brzmiała pewnie." } },
      { t: "Słuchawki mają 2 lata gwarancji." },
      { t: "Zwrotu możesz dokonać do 60 dni od zakupu.", h: { src: -1, note: "W źródle nie ma zasad zwrotu. AI nie wie, więc zgaduje, a klient może potem żądać tych 60 dni." } },
      { t: "Bateria starcza na maksymalnie 30 godzin słuchania." }
    ],
    lesson: "Gdy AI czegoś nie wie, rzadko mówi „nie wiem”. Zamiast tego podaje pewnie brzmiące szczegóły. Dopisz do polecenia: „Jeśli czegoś nie ma w źródle, napisz, że tego nie wiesz”."
  }
];

const ROUNDS_EN = [
  {
    task: "The AI summarized notes from a client meeting. Find the 2 sentences that don't match the notes.",
    srcTitle: "Meeting notes",
    src: [
      "Meeting with Nordtex, March 14.",
      "Present: Martha (us), Mark Zielinski (Nordtex).",
      "Nordtex wants to order 200 office chairs, delivery by the end of April.",

function starsWordPl(n) {
  if (n === 1) return "gwiazdka";
  const last = n % 10, lastTwo = n % 100;
  return last >= 2 && last <= 4 && (lastTwo < 12 || lastTwo > 14) ? "gwiazdki" : "gwiazdek";
}

const $ = (id) => document.getElementById(id);
const screen = $("screen");
let current = 0;
let score = 0;
let results = [];   // per text: { caught, total }
let view = "start";
let flags = new Set();   // indexes of flagged sentences
let checked = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const madeUp = (r) => r.sents.map((s, i) => (s.h ? i : -1)).filter((i) => i >= 0);
const maxStars = () => ROUNDS.reduce((s, r) => s + madeUp(r).length, 0);

function setScreen(html) {
  screen.classList.remove("screen-in");
  screen.innerHTML = html;
  void screen.offsetWidth;
  screen.classList.add("screen-in");
}

function setChrome(inGame) {
  $("stats").classList.toggle("hidden", !inGame);
  $("trail").classList.toggle("hidden", !inGame);
  $("footnote").classList.toggle("hidden", !inGame);
  $("lang").classList.toggle("hidden", inGame);
}

function readSavedLang() {
  try { return localStorage.getItem("lang"); } catch (e) { return null; }
}

function setLang(l) {
  lang = l === "en" ? "en" : "pl";
  ROUNDS = lang === "en" ? ROUNDS_EN : ROUNDS_PL;
  T = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  $("logo").innerHTML = T.logo;
  $("footnote").textContent = T.footnote;
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("lang", lang); } catch (e) { /* storage unavailable */ }
}

document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  setLang(b.dataset.lang);
  if (view === "end") showEnd(); else showStart();
}));

function updateStats(bump) {
  $("progressText").textContent = `${current + 1}/${ROUNDS.length}`;
  const sp = $("scoreText");
  sp.innerHTML = `${ICONS.star}<span>${score}</span>`;
  sp.setAttribute("aria-label", `${T.points}: ${score}`);
  if (bump) { sp.classList.remove("bump"); void sp.offsetWidth; sp.classList.add("bump"); }
  $("trail").innerHTML = ROUNDS.map((_, i) => {
    const res = results[i];
    if (res) return `<span class="step ${res.caught === res.total ? "ok" : res.caught ? "part" : "no"}"></span>`;
    return `<span class="step${i === current ? " now" : ""}"></span>`;
  }).join("");
}

function seriesHTML() {
  return `<p class="series">${esc(T.series)} ${T.games.map(([name, url]) => `<a href="${url}?lang=${lang}">${esc(name)} ${ICONS.arrow}</a>`).join("")}</p>
    <p class="series home"><a href="https://kian09j.github.io/?lang=${lang}">${esc(T.home)} ${ICONS.arrow}</a></p>`;
}

function showRound() {
  view = "round";
  setChrome(true);
  updateStats();
  flags = new Set();
  checked = false;
  const r = ROUNDS[current];
  setScreen(`
    <div class="guide">
      ${mascot("think")}
      <div class="bubble" id="bubble" role="status" aria-live="polite">${esc(T.think)}</div>
    </div>
    <span class="round-tag">${esc(T.round)} ${current + 1}</span>
    <p class="task">${esc(r.task)}</p>
    <div class="box-label">${ICONS.doc} ${esc(T.srcLabel)}: ${esc(r.srcTitle)}</div>
    <div class="src"><ul id="src">${r.src.map((line) => `<li>${esc(line)}</li>`).join("")}</ul></div>
    <div class="box-label">${ICONS.ai} ${esc(r.aiTitle)}</div>
    <div class="ai" id="ai">
      ${r.question ? `<p class="q"><b>${esc(T.question)}</b> ${esc(T.quote(r.question))}</p>` : ""}
      <p class="body">${r.sents.map((s, i) => `<span class="sent" role="button" tabindex="0" aria-pressed="false" data-i="${i}">${esc(s.t)}</span>`).join(" ")}</p>
    </div>
    <div class="check-row">
      <span class="counter" id="counter" aria-live="polite"></span>
      <button class="btn" id="checkBtn">${esc(T.check)} ${ICONS.arrow}</button>
    </div>
    <div id="after"></div>`);
  screen.querySelectorAll(".sent").forEach((s) => {
    s.addEventListener("click", () => toggle(+s.dataset.i));
    s.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(+s.dataset.i); }
    });
  });
  $("checkBtn").onclick = check;
  updateFlags();
  screen.querySelector(".sent").focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggle(i) {
  if (checked) return;
  const need = madeUp(ROUNDS[current]).length;
  if (flags.has(i)) flags.delete(i);
  else if (flags.size < need) flags.add(i);
  else {
    const c = $("counter");
    c.textContent = T.full(need);
    c.classList.remove("nudge"); void c.offsetWidth; c.classList.add("nudge");
    return;
  }
  updateFlags();
}

function updateFlags() {
  const need = madeUp(ROUNDS[current]).length;
  screen.querySelectorAll(".sent").forEach((s) => s.setAttribute("aria-pressed", String(flags.has(+s.dataset.i))));
  const c = $("counter");
  c.classList.remove("nudge");
  c.textContent = T.counter(flags.size, need);
  $("checkBtn").disabled = checked || flags.size !== need;
}

function setBubble(text, cls) {
  const b = $("bubble");
  b.textContent = text;
  b.className = "bubble pop " + (cls || "");
}

function check() {
  const r = ROUNDS[current];
  const fake = madeUp(r);
  if (checked || flags.size !== fake.length) return;
  checked = true;
  updateFlags();

  const caught = fake.filter((i) => flags.has(i)).length;
  score += caught;
  results.push({ caught, total: fake.length });
  updateStats(caught > 0);

  // Mark each sentence and light up the source lines the made-up ones should be compared with.
  $("ai").classList.add("checked");
  const notes = [];
  screen.querySelectorAll(".sent").forEach((s) => {
    const i = +s.dataset.i, sent = r.sents[i], flagged = flags.has(i);
    s.removeAttribute("role");
    s.removeAttribute("tabindex");
    s.removeAttribute("aria-pressed");
    let kind = "";
    if (sent.h && flagged) kind = "caught";
    else if (sent.h) kind = "missed";
    else if (flagged) kind = "wrongflag";
    if (!kind) return;
    s.classList.add(kind);
    notes.push({ kind, text: sent.t, note: sent.h ? sent.h.note : T.wrongNote });
    if (sent.h && sent.h.src >= 0) $("src").children[sent.h.src].classList.add("hit");
  });

  const mood = caught === fake.length ? "happy" : caught ? "idle" : "oops";
  screen.querySelector(".mascot").dataset.mood = mood;
  if (caught === fake.length) setBubble(T.all, "ok");
  else if (caught) setBubble(T.some(caught, fake.length), "part");
  else setBubble(T.none, "no");

  const isLast = current === ROUNDS.length - 1;
  $("after").innerHTML = `
    <ul class="notes">
      ${notes.map((n, k) => `
        <li class="${n.kind}" style="animation-delay:${k * 0.08}s">
          <span class="tag">${esc(T[n.kind])}</span>
          <q>${esc(n.text)}</q>
          <span>${esc(n.note)}</span>
        </li>`).join("")}
    </ul>
    <div class="lesson"><h3>${ICONS.bulb} ${esc(T.lesson)}</h3><p id="lessonText">${esc(r.lesson)}</p></div>
    <div class="actions"><button class="btn" id="nextBtn" aria-describedby="lessonText">${esc(isLast ? T.result : T.next)} ${ICONS.arrow}</button></div>`;
  const nextBtn = $("nextBtn");
  nextBtn.onclick = () => { if (isLast) showEnd(); else { current++; showRound(); } };
  // The Check button was disabled, so focus fell back to the page: hand it to the next step.
  nextBtn.focus({ preventScroll: true });
  $("after").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function showEnd() {
  view = "end";
  setChrome(false);
  const total = maxStars();
  const msg = T.msgs[score === total ? 0 : score >= total * 0.75 ? 1 : score >= total / 2 ? 2 : 3];
  setScreen(`
    <div class="hero">
      ${mascot(score >= total / 2 ? "happy" : "think")}
      <div class="score-blob"><b>${score}/${total}</b><br><span>${esc(T.stars(score))}</span></div>
      <p class="score-msg">${esc(msg)}</p>
    </div>
    <h2>${esc(T.endTitle)}</h2>
    <ol class="rules">
      ${T.rules.map(([t, d], i) => `
        <li style="--note:${NOTE_COLORS[i % NOTE_COLORS.length]};--delay:${0.15 + i * 0.12}s">
          <span class="num">${i + 1}</span><div><strong>${esc(t)}:</strong> ${esc(d)}</div>
        </li>`).join("")}
    </ol>
    <div class="callout"><span class="ico">${ICONS.tip}</span><div><strong>${esc(T.tipTitle)}</strong>${esc(T.tip)}</div></div>
    <div class="end-actions"><button class="btn" id="againBtn">${esc(T.again)} ${ICONS.arrow}</button></div>
    ${seriesHTML()}`);
  $("againBtn").onclick = startGame;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const urlLang = new URLSearchParams(location.search).get("lang");
setLang(urlLang === "en" || urlLang === "pl" ? urlLang : readSavedLang() || "pl");
showStart();
</script>
</body>
</html>
